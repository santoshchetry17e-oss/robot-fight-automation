
name: Daily Robot Fight Video

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install imageio pillow imageio-ffmpeg

      - name: Create Robot Video
        run: python robot_video.py

      - name: Save Video
        uses: actions/upload-artifact@v4
        with:
          name: robot-fight-video
          path: videos/robot_fight.mp4
          
        
